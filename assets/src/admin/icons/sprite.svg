<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
	<!--
		Zero Spam icon sprite (6.0 admin). Inline it once per page; reference symbols with
		<svg class="zs-icon" aria-hidden="true" focusable="false"><use href="#zs-i-shield"/></svg>.

		zs-mark       the mark, treatment B "Live core", for 21px and up. Each brick is a
		              <g class="zs-b" data-i="N"> (N = position, row by row from the top;
		              no ids, so inline copies never clash) with its .zs-f fill and a
		              .zs-sh sheen; .zs-coreglow, .zs-pulse and .zs-ring serve the motion
		              states in styles/logo.css. To animate it,
		              copy the symbol's content into an inline <svg viewBox="0 0 256 242">;
		              CSS cannot reach inside a <use> instance.
		zs-mark-flat  treatment A, the pixel-snapped grid for 20px and smaller.
		zs-mark-mono  one colour (currentColor; the bricks around the core at 70% opacity).
		              The WordPress admin menu needs explicit fills instead:
		              assets/img/zero-spam-menu-icon.svg.
		zs-i-*        UI icons, 24px grid, drawn with strokes: give the <svg> class zs-icon
		              (styles/base.css) for fill:none and stroke:currentColor.

		The sheen, pulse and ring layers carry opacity="0", so a <use> instance (which page
		CSS cannot reach) draws the static mark; logo.css animations override it.

		The marks were generated from the approved logo pass (no mirror transform, one
		element per brick, no editor metadata); edit this file by hand from here.
	-->
	<defs>
		<linearGradient id="zs-g-63000d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#820011"/><stop offset="1" stop-color="#440009"/></linearGradient>
		<linearGradient id="zs-g-840012" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a30016"/><stop offset="1" stop-color="#65000e"/></linearGradient>
		<linearGradient id="zs-g-be0000" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dd0000"/><stop offset="1" stop-color="#9f0000"/></linearGradient>
		<linearGradient id="zs-g-ff2929" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4848"/><stop offset="1" stop-color="#ff0a0a"/></linearGradient>
		<linearGradient id="zs-g-ff7038" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8657"/><stop offset="1" stop-color="#ff5a19"/></linearGradient>
		<linearGradient id="zs-g-ffa17c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb79b"/><stop offset="1" stop-color="#ff8b5d"/></linearGradient>
		<linearGradient id="zs-hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".32" stop-color="#fff" stop-opacity="0"/></linearGradient>
		<linearGradient id="zs-sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".55" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
		<linearGradient id="zs-core" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6E5A"/><stop offset=".55" stop-color="#FF2929"/><stop offset="1" stop-color="#D81818"/></linearGradient>
		<radialGradient id="zs-core-glow"><stop offset="0" stop-color="#FF2929" stop-opacity=".95"/><stop offset=".45" stop-color="#FF2929" stop-opacity=".4"/><stop offset="1" stop-color="#FF2929" stop-opacity="0"/></radialGradient>
		<radialGradient id="zs-pulse-fill"><stop offset="0" stop-color="#FF2929" stop-opacity="1"/><stop offset=".5" stop-color="#FF2929" stop-opacity=".55"/><stop offset="1" stop-color="#FF2929" stop-opacity="0"/></radialGradient>
	</defs>
